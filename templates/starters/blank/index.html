<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>App</title>
  <style>
    :root {
      --bg:        #0b0b0d;
      --surface:   #16171a;
      --border:    rgba(255,255,255,0.08);
      --text:      #f5f5f7;
      --muted:     rgba(245,245,247,0.55);
      --accent:    #5b9dff;
      --accent-2:  #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      -webkit-user-select: none;
      user-select: none;
    }
    .app {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(60% 50% at 0% 0%,   rgba(91,157,255,0.10) 0%, transparent 60%),
        radial-gradient(60% 50% at 100% 100%, rgba(167,139,250,0.10) 0%, transparent 60%),
        var(--bg);
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 8px 24px -8px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .tagline { color: var(--muted); margin-top: 6px; font-size: 13px; }
    .counter {
      margin-top: 22px;
      padding: 18px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .counter-value {
      font-size: 36px; font-weight: 600;
      font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }
    .counter-actions { display: flex; gap: 8px; }
    button {
      font: inherit;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      cursor: default;
      transition: background 100ms, border-color 100ms;
    }
    button:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.16); }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent; color: white;
    }
    button.primary:hover { filter: brightness(1.08); }
    .info {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.7;
    }
    .info b { color: var(--text); font-weight: 500; }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <h1 id="title">Welcome</h1>
      <div class="tagline">A blank Electron starter — edit <code>index.html</code> + <code>main.js</code> to make it yours.</div>

      <div class="counter">
        <div class="counter-value" id="counter">0</div>
        <div class="counter-actions">
          <button id="reset">Reset</button>
          <button id="inc" class="primary">Increment</button>
        </div>
      </div>

      <div class="info" id="info">Loading runtime info…</div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
